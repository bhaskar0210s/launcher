name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Xcode
        run: |
          xcodebuild -version
          swiftc --version
      - name: Unit tests
        run: make test
      - name: Build
        run: make dmg
      - name: Package
        run: ditto -c -k --keepParent build/Launcher.app Launcher.zip
      - uses: actions/upload-artifact@v7
        with:
          name: Launcher
          path: |
            Launcher.zip
            build/Launcher.dmg
